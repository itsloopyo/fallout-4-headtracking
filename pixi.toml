[workspace]
name = "fallout-4-head-tracking"
version = "0.0.0"
description = "Head tracking mod for Fallout 4 using CameraUnlock shared library"
license = "MIT"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"

# No -G: let CMake auto-detect the installed Visual Studio generator. Pinning
# "Visual Studio 17 2022" broke on CI once the windows runner image moved to
# VS 2026 (VS 17 absent); auto-detect picks whatever VS the machine has.
setup = { cmd = """
    powershell -Command "if (-not (Test-Path 'build')) { cmake -B build -A x64 } else { Write-Host 'Build directory exists, skipping setup' -ForegroundColor Yellow }"
""" }

update-deps = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1"

fast-load = "powershell -ExecutionPolicy Bypass -File scripts/fast-load.ps1"
fast-load-restore = "powershell -ExecutionPolicy Bypass -File scripts/fast-load.ps1 -Restore"

# Native unit tests, and the config differential test that holds the frozen legacy
# reader to the published build's. Separate build tree, so it never disturbs build/
# or bin/.
test-unit = "powershell -ExecutionPolicy Bypass -File scripts/run-tests.ps1 -Suite unit"
test-differential = "powershell -ExecutionPolicy Bypass -File scripts/run-tests.ps1 -Suite differential"
test = { depends-on = ["test-unit", "test-differential"] }
build-tests = "powershell -ExecutionPolicy Bypass -File scripts/run-tests.ps1 -BuildOnly"

# Rewrites HeadTracking.ini, the committed config, from the config table after a change to a
# row, a comment or a default, then writes the launcher manifest's config descriptor per_game
# from it. The config tests fail until it has run.
render-config = { cmd = "build-tests/tests/Debug/fallout4_config_tests.exe --render-config HeadTracking.ini && node cameraunlock-core/scripts/encode-seed.mjs", depends-on = ["build-tests"] }

build = { cmd = "cmake --build build --config Debug", depends-on = ["setup"] }
build-release = { cmd = "cmake --build build --config Release", depends-on = ["setup"] }

# deploy-all, not deploy: Fallout 4 is commonly owned on more than one of Steam,
# GOG and Game Pass at once, and deploy.ps1 resolves the single highest-priority
# install. Deploying to one store while launching another looks exactly like a
# fix that did not work.
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy-all.ps1 Release", depends-on = ["build-release"] }
# Every install, not just the first one find-game.ps1 returns: Fallout 4 is
# commonly installed from more than one of Steam, GOG and Game Pass at once, and
# uninstall.cmd resolves a single path. The wrapper passes /y (pixi run
# allocates no TTY, and the shared uninstall body ends with `if not defined
# YES_FLAG ( echo. & pause )` - that pause reads an invalid handle and aborts
# the task) and /force (a dev deploy writes no state file, so the dxgi.dll
# proxy would otherwise be left behind).
uninstall = "powershell -ExecutionPolicy Bypass -File scripts/uninstall-all.ps1"

# No PowerShell variables in an inline pixi cmd: pixi's own shell expands $d
# to the empty string before powershell.exe ever sees it, and the task dies
# with "Missing variable name after foreach".
clean = { cmd = """
    powershell -Command "if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }; if (Test-Path 'build-tests') { Remove-Item 'build-tests' -Recurse -Force }; Write-Host 'Build artifacts cleaned' -ForegroundColor Green"
""" }

clean-all = { cmd = """
    powershell -Command "if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }; if (Test-Path 'build-tests') { Remove-Item 'build-tests' -Recurse -Force }; if (Test-Path 'release') { Remove-Item 'release' -Recurse -Force }; Write-Host 'All build artifacts cleaned' -ForegroundColor Green"
""" }

package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["build-release", "test-unit"] }
release = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1" }

# Core's manifest validator, run by hand, so it is not wired into `package` or into CI - the
# release gates that must always run live in the packager instead. It reads the built
# installer ZIP, hence the dependency.
validate-manifest = { cmd = "node cameraunlock-core/scripts/validate-manifest.mjs", depends-on = ["package"] }
show-changelog = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/show-changelog.ps1" }

[dependencies]
